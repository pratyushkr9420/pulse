[project]
name = "pulse-backend"
version = "0.1.0"
description = "Pulse Stock News Chatbot Backend"
requires-python = ">=3.12"
dependencies = [
    # Core Framework
    "fastapi>=0.123.0",
    "uvicorn>=0.32.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    # LangChain & RAG (NO LangGraph) - Using 0.3.x stable series
    # Note: LangChain 1.x is available but 0.3.x is more stable for production
    "langchain>=0.3.13",
    "langchain-openai>=0.3.0",
    "langchain-community>=0.3.13",
    "langchain-qdrant>=0.2.0", # For hybrid search support
    # OpenAI
    "openai>=1.55.0",
    # Vector Database
    "qdrant-client>=1.12.0",
    "fastembed>=0.4.0", # For BM25 sparse embeddings (hybrid search)
    "numpy<2.0", # Pin to numpy 1.x for onnxruntime compatibility
    # Database
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    # Caching & Rate Limiting
    "redis>=5.2.0",
    "slowapi>=0.1.9",
    # Authentication
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.18",
    # Logging & Observability
    "structlog>=24.4.0",
    "python-json-logger>=2.0.7",
    "sentry-sdk>=2.19.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    # HTTP Client
    "httpx>=0.28.0",
    "bleach>=6.3.0",
    "aiosqlite>=0.21.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",

    # LLM Evaluation
    "deepeval>=2.0.0",

    # Test Infrastructure
    "testcontainers>=4.8.0",
    "factory-boy>=3.3.0",

    # Linting & Formatting
    "ruff>=0.8.0",
    "mypy>=1.13.0",

    # Type Stubs
    "types-passlib>=1.7.7",
    "types-python-jose>=3.3.4",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
