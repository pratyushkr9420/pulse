version: '3.8'

services:
  postgres-test:
    image: postgres:16-alpine
    container_name: pulse-postgres-test
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test
    tmpfs:
      - /var/lib/postgresql/data

  redis-test:
    image: redis:7-alpine
    container_name: pulse-redis-test
    ports:
      - "6380:6379"

  qdrant-test:
    image: qdrant/qdrant:latest
    container_name: pulse-qdrant-test
    ports:
      - "6335:6333"
