name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/frontend/package-lock.json
      - run: cd packages/frontend && npm ci
      - run: cd packages/frontend && npm run lint
      - run: cd packages/frontend && npx tsc --noEmit

  lint-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - run: cd packages/backend && uv venv && uv sync --extra dev
      - run: cd packages/backend && uv run ruff check src
      - run: cd packages/backend && uv run mypy src || true

  test-frontend:
    runs-on: ubuntu-latest
    needs: lint-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/frontend/package-lock.json
      - run: cd packages/frontend && npm ci
      - run: cd packages/frontend && npm run test:unit -- --run --coverage
      - uses: codecov/codecov-action@v4
        with:
          file: packages/frontend/coverage/coverage-final.json
          flags: frontend

  test-backend:
    runs-on: ubuntu-latest
    needs: lint-backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - run: cd packages/backend && uv venv && uv sync --extra dev
      - run: cd packages/backend && uv run pytest tests/unit --cov=src --cov-report=xml
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test
      - uses: codecov/codecov-action@v4
        with:
          file: packages/backend/coverage.xml
          flags: backend

  build:
    runs-on: ubuntu-latest
    needs: [test-frontend, test-backend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/frontend/package-lock.json
      - run: cd packages/frontend && npm ci
      - run: cd packages/frontend && npm run build
