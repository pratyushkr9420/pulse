name: Frontend Tests

on:
  push:
    branches: [main]
    paths:
      - 'packages/frontend/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/frontend/**'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/frontend/package-lock.json
      - run: cd packages/frontend && npm ci
      - run: cd packages/frontend && npm run test:unit -- --run --coverage
      - uses: codecov/codecov-action@v4
        with:
          file: packages/frontend/coverage/coverage-final.json
          flags: frontend-unit

  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/frontend/package-lock.json
      - run: cd packages/frontend && npm ci
      - run: cd packages/frontend && npx playwright install --with-deps
      - run: cd packages/frontend && npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/frontend/playwright-report/
