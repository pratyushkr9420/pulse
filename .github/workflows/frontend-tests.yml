name: Frontend Tests

on:
  push:
    branches: [main]
    paths:
      - 'packages/frontend/**'
  pull_request:
    branches: [main]
    paths:
      - 'packages/frontend/**'

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/frontend/package-lock.json
      - run: cd packages/frontend && npm ci
      - run: cd packages/frontend && npm run test:unit -- --run --coverage
      - uses: codecov/codecov-action@v4
        with:
          file: packages/frontend/coverage/coverage-final.json
          flags: frontend-unit

  e2e-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stocknews
          POSTGRES_PASSWORD: stocknews
          POSTGRES_DB: stocknews
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@v4

      # Setup backend
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v4
      - name: Install backend dependencies
        run: cd packages/backend && uv venv && uv sync --extra dev

      # Run migrations and start backend server in background
      - name: Start backend server
        run: |
          cd packages/backend
          uv run alembic upgrade head
          uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 &
          sleep 5
        env:
          DATABASE_URL: postgresql+asyncpg://stocknews:stocknews@localhost:5432/stocknews
          REDIS_URL: redis://localhost:6379/0
          QDRANT_HOST: localhost
          QDRANT_PORT: 6333
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          JWT_SECRET_KEY: test-secret-key-for-ci-only-not-for-production
          ENVIRONMENT: test

      # Wait for backend health check
      - name: Wait for backend to be ready
        run: |
          timeout 30 bash -c 'until curl -f http://localhost:8000/health; do sleep 2; done'

      # Setup frontend and run E2E tests
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: packages/frontend/package-lock.json
      - run: cd packages/frontend && npm ci
      - run: cd packages/frontend && npx playwright install --with-deps
      - run: cd packages/frontend && npm run test:e2e
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: packages/frontend/playwright-report/
